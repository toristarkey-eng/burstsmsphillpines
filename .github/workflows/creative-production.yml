name: Controlled creative production
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r creative_service/requirements.txt
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_creative_service.py' -v
      - run: docker build -f creative_service/Dockerfile -t burst-creative:test .
      - name: Verify container as the non-root runtime user
        run: |
          docker run --rm --network none --entrypoint sh burst-creative:test -c 'node scripts/validate-design-system.mjs && node --test tests/brand-workflow.test.mjs && python -c "from creative_service.renderer import Campaign, render; png, report = render(Campaign(template_id=\"recognition\", headline=\"Make every message count.\", primary_text=\"Explore messaging for your business.\")); assert report[\"dimensions\"] == [1080, 1350]; assert all(report[\"checks\"].values()); assert len(png) > 1000; print(\"Container renderer smoke passed\")"'
